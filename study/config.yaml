# Study configuration. Every tunable lives here; the code has no magic numbers.
#
# This file is part of the method. Commit it, and treat a change after the
# pilot as a protocol deviation to be reported.

seed: 20261019

# Pinned prompt version. Prompts live in study/prompts/<name>.<version>.txt and
# are published verbatim with the thesis. Unlike the product, the study never
# picks "the latest" prompt automatically: a new file must not change a run.
prompt_version: v1

paths:
  # Folder holding the claim files: *.csv / *.tsv (see `claims.csv` below)
  # and/or *.jsonl. Relative to the repo root, or an absolute path such as
  # C:/Users/you/thesis/claims. The STUDY_CLAIMS_DIR environment variable
  # overrides it, and is then written into every output's provenance.
  claims: study/claims
  packs: study/packs               # frozen evidence packs (gitignored)
  responses: study/responses       # raw model output (gitignored)
  results: study/results           # scored rows, summaries, worksheets

# ------------------------------------------------------------------ claims
claims:
  csv:
    # CSV header -> field. Matching ignores case, extra spaces and curly
    # apostrophes. `claim` and `rating` are required; the rest are optional.
    columns:
      claim: claim
      rating: rate
      question: question
      comment: comment
      whats_true: "what's true"
      whats_false: "what's false"
      whats_unknown: "what's unknown"
      origin: origin
      summary: summary
      # Used if present, otherwise derived:
      id: id
      set: set
      domain: domain
      source_id: source_id
      source_url: source_url
      source_published: source_published
      surface_detectable: surface_detectable

    # THE GOLD LABEL. Fact-check ratings -> the study's three labels.
    # Matching ignores case and punctuation. Only ratings that unambiguously
    # mean one label are mapped. Run `python -m study.claimsets check` to see
    # every rating in your files and where it went, and DECIDE the
    # excluded ones before building packs; this table is part of the method.
    #
    # Caveat for the thesis: a fact-checker's "Unproven" means nobody could
    # establish it; the study's not_enough_evidence means "not established BY
    # THIS PACK". They coincide only if the pack holds no deciding evidence.
    rating_to_label:
      supported: ["true", "correct attribution", "legit", "correct"]
      refuted: ["false", "misattributed", "fake", "pants on fire", "incorrect"]
      not_enough_evidence: ["unproven"]
    # Known ratings left out on purpose (counted as "excluded (config)").
    # Move one into the table above if you decide how it maps.
    excluded_ratings:
      - mostly true
      - mostly false
      - half true
      - mixture
      - mixed
      - unfounded          # "no evidence for it": closer to refuted than NEI; your call
      - outdated
      - miscaptioned
      - satire
      - labeled satire
      - originated as satire
      - legend
      - lost legend
      - scam
      - research in progress
      - recall
      - misleading
      - missing context
    # File name -> set, e.g. {"snopes_2024.csv": A, "snopes_2026.csv": B}.
    # Unlisted files use a `set` column if there is one, else the file name.
    set_by_file:
      "claims - Dataset A.csv": A
    # Gold labels judged against the frozen PACK, where the fact-checker's
    # rating cannot be reached from the evidence a model is given. The
    # original rating is kept (factcheck_rating, label_original) and the
    # override is recorded on the claim. Decide these from the audit, before
    # any model run. Format:
    #   claims_Dataset_A-0002: {label: not_enough_evidence, reason: "pack has nothing on the fatwa"}
    # Decided 2026-10-21 from the Dataset A audit, before any model run.
    label_overrides:
      claims_Dataset_A-0002: {label: not_enough_evidence, reason: "pack has nothing on an ISIS fatwa about puppies"}
      claims_Dataset_A-0004: {label: not_enough_evidence, reason: "pack never mentions any content warning"}
      claims_Dataset_A-0006: {label: not_enough_evidence, reason: "pack has nothing refuting the 15,000 figure; a DW passage cites an unrelated 15,000"}
      claims_Dataset_A-0007: {label: not_enough_evidence, reason: "pack shows World Vision had 60 church partners, but not how many churches opened"}
      claims_Dataset_A-0008: {label: not_enough_evidence, reason: "search returned only fact-checks (excluded) and a petition page; nothing shows texting RBG reaches senators"}
    # With no `domain` column, every claim gets this (a key of
    # packs.domain_to_category). `general` searches the web without a
    # subject-specific source pack.
    default_domain: general

# ------------------------------------------------------------------ models
# MODEL NAMES ARE PLACEHOLDERS ON PURPOSE. Fill them from each provider's
# model list on the day the pilot starts and do not change them afterwards.
# The runner refuses to call a model whose name is still CHANGE_ME.
#
# temperature: a number is sent as-is; null means "do not send the field".
# What was actually sent is recorded in every response row.
#
#   * OpenAI GPT-5-family reasoning models reject any temperature other than
#     the default; GPT-5.1 and later accept it only at reasoning effort `none`.
#     Use null for those, or set reasoning_effort: none.
#   * Google's Gemini 3 guide recommends leaving temperature at 1.0 and says
#     lower values can cause looping or degraded reasoning. 0 is still sent
#     below because the study protocol asks for it — decide this explicitly
#     before the pilot and record the decision.
#   * Groq: do NOT use a `groq/compound*` id (those systems search server-side).
#     Groq's built-in-tools page says the gpt-oss models can call built-in tools
#     on their own; if you pick a gpt-oss model, the search-leak probe is the
#     only evidence that it did not. A non-gpt-oss open-weight model avoids
#     the question.
models:
  openai:
    provider: openai
    model: CHANGE_ME
    temperature: 0
    reasoning_effort: null         # e.g. none | low; null = not sent
    max_output_tokens: 1500
    timeout_s: 90
  gemini:
    provider: gemini
    model: CHANGE_ME
    temperature: 0
    thinking_level: null           # e.g. low; null = not sent
    max_output_tokens: 1500
    timeout_s: 90
  groq:
    provider: groq
    model: CHANGE_ME
    temperature: 0
    reasoning_effort: null
    max_output_tokens: 1500
    timeout_s: 90
  # Offline stand-in. Makes no network call and is never part of the study.
  # Its rows are marked provider=stub. Used for tests and for showing the
  # shape of the data before keys exist.
  stub:
    provider: stub
    model: stub-offline
    temperature: 0
    max_output_tokens: 1500
    timeout_s: 1

# Models included when --models is not given. `stub` is deliberately absent.
study_models: [openai, gemini, groq]

# Substrings that mark a model id as a search product. A model whose id
# contains any of these is refused in closed-book mode.
search_model_markers: ["search", "groq/compound", "sonar"]

retry:
  max_attempts: 6
  base_delay_s: 2.0
  max_delay_s: 60.0
  # 429, 408 and 5xx are retried with exponential backoff and full jitter.
  # Any other 4xx (404 wrong model, 400 bad parameter, 401/403 bad key) fails
  # immediately: retrying cannot fix it and hides the cause.
  retry_statuses: [408, 429, 500, 502, 503, 504]

conditions: [free, format, citation]

# Verdict labels shown to the model, identical in every condition.
labels:
  supported: "supported"
  refuted: "refuted"
  nei: "not enough evidence"

# ------------------------------------------------------------------- packs
packs:
  max_passages: 8
  max_chars_per_passage: 1500
  # Fact-check claims will often retrieve their OWN fact-check: the
  # prior_check channel returns the publisher's rating ("... - Rating: False")
  # and web search finds the article. A pack holding the answer key tests
  # copying, not checking. Packs record this as a warning either way; listing
  # a channel or domain here removes those documents BEFORE freezing.
  # Decide before building: changing it later means rebuilding every pack.
  # How many results to ask each search channel for. FactShield's own
  # retrieve() asks for 3 (backend/config/models.yaml). With fact-check
  # sites excluded, those 3 were often all fact-checks, leaving packs empty
  # (4 of 7 refuted claims in claims_Dataset_A). With a number here, the study
  # calls the same app.retrieval channel functions itself with this limit and
  # removes exclusions AFTER fetching, so excluded sites cannot use up slots.
  # null = call app.retrieval.retrieve() exactly as the product does.
  fetch_per_channel: 8
  # Decided before any model run (claims_Dataset_A): the claims and their
  # gold labels come from Snopes, so fact-checking organisations and
  # published ratings are kept out of every pack.
  exclude_channels: [prior_check]
  # Fact-checking organisations: their pages carry verdicts. The first three
  # are in FactShield's own trusted-source list; the rest turn up via open web.
  exclude_domains: [snopes.com, politifact.com, fullfact.org, factcheck.org, leadstories.com,
                    checkyourfact.com, truthorfiction.com, hoax-slayer.net, africacheck.org,
                    factcheck.afp.com, boomlive.in, altnews.in, misbar.com, logicallyfacts.com,
                    healthfeedback.org, sciencefeedback.co, climatefeedback.org, metafact.io]
  # Case-insensitive substrings of a URL. Catches fact-check desks on news
  # sites (reuters.com/.../fact-check-..., apnews.com/article/archive-fact-
  # checking-...) and stories whose URL names a fact-checker's verdict.
  exclude_url_patterns: [fact-check, factcheck, fact-checking, fact-or-fiction, snopes, politifact,
                         fullfact, /hoax-or-fact, /verify/, /truth-o-meter]
  # Individual pages removed after reading them in `python -m study.packs
  # audit`. Exact URLs. Each one is a judgement: note why next to it.
  exclude_urls: []
  # How a retrieved page becomes the passage a model sees (study/passages.py).
  # Applied to every document after the URL/domain exclusions above. Each
  # removal is recorded in the pack with its reason.
  processing:
    enabled: true
    # Lines shorter than this with no sentence punctuation are treated as
    # menus, section labels or headline lists and removed.
    min_words_per_line: 6
    # After cleaning, keep the sentences most about the claim, each with this
    # many neighbours, in their original order, up to max_chars_per_passage.
    context_sentences: 1
    # Drop a page with almost no article text left after cleaning. Kept low on
    # purpose: search often returns a short snippet that is real evidence
    # ("Trump appeared to give Gentiloni the finger"). Menu pages are caught by
    # the off-topic rule instead.
    min_chars: 60
    # Drop a passage that attributes a finding to one of these by name
    # ("According to Snopes", "PolitiFact rated", "as verified by ...").
    drop_factcheck_mentions: true
    factchecker_names: [Snopes, PolitiFact, FactCheck.org, Full Fact, Lead Stories, Check Your Fact,
                        Truth or Fiction, TruthOrFiction, AFP Fact Check, Reuters Fact Check,
                        AP Fact Check, USA Today Fact Check, Africa Check, Health Feedback,
                        Science Feedback, the fact-checkers, fact-checkers, fact checkers]
    # Drop a passage sharing less than this share of the claim's content words.
    # Lenient on purpose: word overlap misses paraphrase. At 0.25 it dropped
    # "noctilucent clouds ... linked to global warming" for a claim about "night
    # clouds ... human-caused climate change". Noise costs little; a lost
    # deciding passage can leave a pack unable to settle its claim.
    min_claim_overlap: 0.15
    # Drop a passage whose words overlap this much with one already kept.
    duplicate_jaccard: 0.8
    # Warnings (claim kept, but review it in the audit):
    warn_below_passages: 3
    warn_best_overlap_below: 0.5

  # Study claims carry a `domain`; FactShield's retrieval wants a `category`.
  # In the product, triage chooses the category with an LLM. The study must
  # not call triage, so the mapping is fixed here and published.
  domain_to_category:
    health: medical
    medicine: medical
    science: science
    climate: science
    politics: political
    economics: financial
    finance: financial
    business: financial
    default: general

# ------------------------------------------------------------------- probes
probe:
  closed_book_repeats: 2
  leak_check:
    n_claims: 6
    # Only claims whose alteration is NOT detectable from the surface text:
    # an implausible number can be refuted without knowledge or search.
    require_not_surface_detectable: true
    claim_set: B
    alpha: 0.05

# ------------------------------------------------------------------- runner
run:
  concurrency: 4
  live_search:
    n_claims: 10                   # small, labelled subset; never the default

# ------------------------------------------------------------------- coding
citations:
  sample_size: 150

analysis:
  # laplace: statsmodels fit_map. vb: fit_vb, which under-covers badly here
  # (see study/analyse.py docstring). Do not switch to vb for inference.
  mixed_method: laplace
  bootstrap_reps: 2000
  ci_level: 0.95
  synthetic:
    n_sources: 40
    claims_per_source: 3
    n_repeats: 2
